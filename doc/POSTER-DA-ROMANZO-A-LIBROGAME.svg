<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1700" width="420mm" height="594mm" font-family="Helvetica, Arial, sans-serif">
  <!-- Poster del metodo uomo-modello (doc/DA-ROMANZO-A-LIBROGAME.md).
       A2 verticale, ma scala a qualunque formato: e' vettoriale.
       Fondo bianco di proposito: e' fatto per essere stampato. -->
  <defs>
    <marker id="freccia" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/>
    </marker>
    <marker id="frecciaRitorno" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b3541e"/>
    </marker>
  </defs>

  <rect width="1200" height="1700" fill="#ffffff"/>

  <!-- ═══ testata ═══ -->
  <text x="60" y="88" font-size="54" font-weight="700" fill="#1a1a1a">Da romanzo a librogame</text>
  <text x="60" y="126" font-size="25" fill="#5a5a5a">Il metodo uomo-modello: lo scrittore scrive, il modello traduce, tu decidi</text>
  <line x1="60" y1="150" x2="1140" y2="150" stroke="#1a1a1a" stroke-width="3"/>

  <!-- ═══ intestazioni delle corsie ═══ -->
  <rect x="60" y="170" width="440" height="44" fill="#1a1a1a"/>
  <text x="80" y="200" font-size="21" font-weight="700" fill="#ffffff" letter-spacing="1.5">IL MODELLO</text>
  <text x="252" y="200" font-size="16" fill="#c9c9c9">fa la lista della spesa</text>

  <rect x="520" y="170" width="230" height="44" fill="#b3541e"/>
  <text x="540" y="200" font-size="21" font-weight="700" fill="#ffffff" letter-spacing="1.5">TU</text>
  <text x="588" y="200" font-size="16" fill="#f6ddd0">decidi</text>

  <rect x="770" y="170" width="370" height="44" fill="#2f5d50"/>
  <text x="790" y="200" font-size="21" font-weight="700" fill="#ffffff" letter-spacing="1.5">LO SCRITTORE</text>
  <text x="1012" y="200" font-size="16" fill="#cfe0da">non vede grafi</text>

  <!-- corsie di sfondo -->
  <rect x="60" y="214" width="440" height="1180" fill="#f7f7f7"/>
  <rect x="520" y="214" width="230" height="1180" fill="#fdf4ee"/>
  <rect x="770" y="214" width="370" height="1180" fill="#f1f6f4"/>

  <!-- ═══ FASE 0 ═══ -->
  <rect x="88" y="250" width="384" height="132" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="110" y="286" font-size="15" font-weight="700" fill="#b3541e" letter-spacing="1.2">FASE 0 · un capitolo per volta</text>
  <text x="110" y="318" font-size="26" font-weight="700" fill="#1a1a1a">Il romanzo diventa catena</text>
  <text x="110" y="346" font-size="17" fill="#444">Taglia in tappe dove il protagonista decide.</text>
  <text x="110" y="368" font-size="17" fill="#444">Marca scontri, abilità, prove e</text>
  <text x="345" y="368" font-size="17" font-weight="700" fill="#1a1a1a">acquisizioni.</text>

  <path d="M 280 400 L 280 436" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#freccia)"/>

  <!-- ═══ GIRO A ═══ -->
  <rect x="88" y="440" width="384" height="128" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="110" y="474" font-size="15" font-weight="700" fill="#b3541e" letter-spacing="1.2">GIRO A · sulla catena, non sul romanzo</text>
  <text x="110" y="506" font-size="26" font-weight="700" fill="#1a1a1a">Dove ramificare</text>
  <text x="110" y="534" font-size="17" fill="#444">Quali tappe sono obbligate, quali</text>
  <text x="110" y="556" font-size="17" fill="#444">acquisizioni si possono saltare.</text>

  <path d="M 280 586 L 280 622" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#freccia)"/>

  <!-- ═══ COMMISSIONI ═══ -->
  <rect x="88" y="626" width="384" height="150" fill="#ffffff" stroke="#1a1a1a" stroke-width="3.5"/>
  <text x="110" y="660" font-size="15" font-weight="700" fill="#b3541e" letter-spacing="1.2">IL PASSAGGIO CHE FA TUTTO</text>
  <text x="110" y="692" font-size="26" font-weight="700" fill="#1a1a1a">Le commissioni</text>
  <text x="110" y="720" font-size="17" fill="#444">13-15 schede in lingua da romanziere.</text>
  <text x="110" y="742" font-size="17" fill="#444">Il rientro non è un numero: è una frase</text>
  <text x="110" y="764" font-size="17" fill="#444">del romanzo, copiata esatta.</text>

  <path d="M 476 700 L 546 700" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#freccia)"/>

  <!-- ═══ CURATORE ═══ -->
  <rect x="550" y="626" width="170" height="150" fill="#ffffff" stroke="#b3541e" stroke-width="3.5"/>
  <text x="570" y="672" font-size="24" font-weight="700" fill="#b3541e">Approvi</text>
  <text x="570" y="702" font-size="24" font-weight="700" fill="#b3541e">e tagli</text>
  <text x="570" y="736" font-size="16" fill="#6b4030">Prima che</text>
  <text x="570" y="757" font-size="16" fill="#6b4030">partano.</text>

  <path d="M 724 700 L 796 700" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#freccia)"/>

  <!-- ═══ SCRITTORE ═══ -->
  <rect x="800" y="606" width="310" height="190" fill="#ffffff" stroke="#2f5d50" stroke-width="3.5"/>
  <text x="822" y="648" font-size="26" font-weight="700" fill="#2f5d50">Scrive le scene</text>
  <text x="822" y="682" font-size="17" fill="#3d4d48">250-350 parole l'una, ognuna</text>
  <text x="822" y="704" font-size="17" fill="#3d4d48">col contesto già dentro la</text>
  <text x="822" y="726" font-size="17" fill="#3d4d48">scheda.</text>
  <text x="822" y="762" font-size="17" fill="#3d4d48">Non deve tenere in testa</text>
  <text x="822" y="784" font-size="17" font-weight="700" fill="#2f5d50">nessuna struttura.</text>

  <path d="M 955 800 L 955 850 L 280 850 L 280 886" fill="none" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#freccia)"/>

  <!-- ═══ GIRO B ═══ -->
  <rect x="88" y="890" width="384" height="118" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="110" y="924" font-size="15" font-weight="700" fill="#b3541e" letter-spacing="1.2">GIRO B · un capitolo per volta</text>
  <text x="110" y="956" font-size="26" font-weight="700" fill="#1a1a1a">Prosa → tappe</text>
  <text x="110" y="984" font-size="17" fill="#444">La prosa originale non si riscrive:</text>
  <text x="110" y="1006" font-size="17" fill="#444">si taglia e si ricuce.</text>

  <path d="M 280 1012 L 280 1048" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#freccia)"/>

  <!-- ═══ FASE 2 ═══ -->
  <rect x="88" y="1052" width="384" height="96" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="110" y="1086" font-size="15" font-weight="700" fill="#b3541e" letter-spacing="1.2">FASE 2</text>
  <text x="110" y="1118" font-size="26" font-weight="700" fill="#1a1a1a">JSON</text>
  <text x="240" y="1118" font-size="17" fill="#444">niente combattimenti né dadi:</text>
  <text x="240" y="1140" font-size="17" fill="#444">quelli si mettono nell'editor</text>

  <path d="M 280 1152 L 280 1188" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#freccia)"/>

  <!-- ═══ LE MISURE ═══ -->
  <rect x="88" y="1192" width="1022" height="176" fill="#1a1a1a"/>
  <text x="112" y="1232" font-size="15" font-weight="700" fill="#e0a878" letter-spacing="1.2">LA MACCHINA MISURA — ./gradlew :tool:cli --args="forma libro.json"</text>
  <text x="112" y="1272" font-size="28" font-weight="700" fill="#ffffff">validate</text>
  <text x="240" y="1272" font-size="20" fill="#b8b8b8">il grafo regge?</text>
  <text x="470" y="1272" font-size="28" font-weight="700" fill="#ffffff">forma</text>
  <text x="570" y="1272" font-size="20" fill="#b8b8b8">ha la forma di un librogame?</text>
  <text x="112" y="1316" font-size="19" fill="#e8e8e8">Non dice solo cosa non va: dice quanto manca.</text>
  <text x="112" y="1348" font-size="19" font-style="italic" fill="#e0a878">«aggiungi ~18 scelte» · «fai rientrare ~8 rami» · «servono ~7 scorciatoie»</text>

  <!-- ciclo di ritorno -->
  <path d="M 88 1280 L 42 1280 L 42 700 L 84 700" fill="none" stroke="#b3541e" stroke-width="3.5" stroke-dasharray="11,7" marker-end="url(#frecciaRitorno)"/>
  <text x="60" y="1010" font-size="17" font-weight="700" fill="#b3541e" transform="rotate(-90 60 1010)" text-anchor="middle">SE LE MISURE NON TORNANO, ALTRE COMMISSIONI</text>

  <path d="M 599 1372 L 599 1408" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#freccia)"/>
  <rect x="330" y="1412" width="540" height="62" fill="#2f5d50"/>
  <text x="600" y="1453" font-size="27" font-weight="700" fill="#ffffff" text-anchor="middle">Quando tornano, il libro si gioca</text>

  <!-- ═══ i numeri ═══ -->
  <line x1="60" y1="1512" x2="1140" y2="1512" stroke="#1a1a1a" stroke-width="3"/>
  <text x="60" y="1548" font-size="17" font-weight="700" fill="#1a1a1a" letter-spacing="1.2">I NUMERI, MISURATI SU 37 LIBROGAME PUBBLICATI · 3 serie, 2 autori, 2 generi</text>

  <g font-size="19" fill="#444">
    <text x="60" y="1590" font-size="34" font-weight="700" fill="#b3541e">1,65</text>
    <text x="60" y="1616">uscite per scena</text>
    <text x="60" y="1640" font-size="16" fill="#777">metà corridoi, metà bivi</text>

    <text x="290" y="1590" font-size="34" font-weight="700" fill="#b3541e">32%</text>
    <text x="290" y="1616">scene con più vie</text>
    <text x="290" y="1640" font-size="16" fill="#777">i rami devono rientrare</text>

    <text x="520" y="1590" font-size="34" font-weight="700" fill="#b3541e">3</text>
    <text x="520" y="1616">tappe di rientro</text>
    <text x="520" y="1640" font-size="16" fill="#777">mediana su 4898 bivi</text>

    <text x="750" y="1590" font-size="34" font-weight="700" fill="#b3541e">42%</text>
    <text x="750" y="1616">cammino obbligato</text>
    <text x="750" y="1640" font-size="16" fill="#777">il resto lo sceglie il lettore</text>

    <text x="980" y="1590" font-size="34" font-weight="700" fill="#b3541e">95%</text>
    <text x="980" y="1616">può ancora vincere</text>
    <text x="980" y="1640" font-size="16" fill="#777">perdere è l'eccezione</text>
  </g>

  <text x="60" y="1678" font-size="15" fill="#8a8a8a">ImmundaNoctisEx · doc/DA-ROMANZO-A-LIBROGAME.md · doc/FORMA-DEI-GRAFI.md · misure da projectaon.org</text>
</svg>
