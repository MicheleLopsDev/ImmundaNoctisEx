<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1700" width="420mm" height="594mm" font-family="Helvetica, Arial, sans-serif">
  <!-- Poster del metodo uomo-modello (doc/DA-ROMANZO-A-LIBROGAME.md).
       A2 verticale, ma scala a qualunque formato: e' vettoriale.
       Fondo bianco di proposito: e' fatto per essere stampato. -->
  <defs>
    <marker id="freccia" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/>
    </marker>
    <marker id="frecciaCiclo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b3541e"/>
    </marker>
  </defs>

  <rect width="1200" height="1700" fill="#ffffff"/>

  <!-- ═══ testata ═══ -->
  <text x="60" y="86" font-size="52" font-weight="700" fill="#1a1a1a">Da romanzo a librogame</text>
  <text x="60" y="124" font-size="24" fill="#5a5a5a">Lo scrittore scrive · Il modello chiede e tiene il conto · Tu decidi</text>
  <line x1="60" y1="148" x2="1140" y2="148" stroke="#1a1a1a" stroke-width="3"/>

  <!-- ═══ il principio ═══ -->
  <rect x="60" y="172" width="1080" height="96" fill="#f2ede7"/>
  <text x="84" y="208" font-size="22" font-weight="700" fill="#1a1a1a">Le domande allo scrittore non le sceglie nessuno: le detta il testo.</text>
  <text x="84" y="240" font-size="19" fill="#444">Il giocatore ha <tspan font-weight="700">5 discipline su 10</tspan>. Dove il romanzo ne usa una, metà dei lettori non ce l'ha —</text>
  <text x="84" y="262" font-size="19" fill="#444">e lì serve una via alternativa, o il libro non è giocabile. Non è design: è meccanica.</text>

  <!-- ═══ intestazioni corsie ═══ -->
  <rect x="60" y="292" width="470" height="42" fill="#1a1a1a"/>
  <text x="80" y="321" font-size="20" font-weight="700" fill="#ffffff" letter-spacing="1.5">IL MODELLO</text>
  <text x="262" y="321" font-size="15" fill="#c9c9c9">chiede e tiene il conto</text>

  <rect x="548" y="292" width="196" height="42" fill="#b3541e"/>
  <text x="568" y="321" font-size="20" font-weight="700" fill="#ffffff" letter-spacing="1.5">TU</text>
  <text x="614" y="321" font-size="15" fill="#f6ddd0">approvi</text>

  <rect x="762" y="292" width="378" height="42" fill="#2f5d50"/>
  <text x="782" y="321" font-size="20" font-weight="700" fill="#ffffff" letter-spacing="1.5">LO SCRITTORE</text>
  <text x="1000" y="321" font-size="15" fill="#cfe0da">non vede grafi</text>

  <rect x="60" y="334" width="470" height="866" fill="#f7f7f7"/>
  <rect x="548" y="334" width="196" height="866" fill="#fdf4ee"/>
  <rect x="762" y="334" width="378" height="866" fill="#f1f6f4"/>

  <!-- ═══ 0 · il romanzo ═══ -->
  <rect x="790" y="362" width="322" height="96" fill="#ffffff" stroke="#2f5d50" stroke-width="3"/>
  <text x="812" y="398" font-size="15" font-weight="700" fill="#2f5d50" letter-spacing="1.2">SI PARTE DA QUI</text>
  <text x="812" y="428" font-size="24" font-weight="700" fill="#1a1a1a">Il romanzo</text>
  <text x="812" y="450" font-size="16" fill="#3d4d48">con scontri e abilità già scritti nel testo</text>

  <path d="M 786 410 L 300 410 L 300 448" fill="none" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#freccia)"/>

  <!-- ═══ 1 · sunto ═══ -->
  <rect x="92" y="452" width="406" height="106" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="114" y="486" font-size="15" font-weight="700" fill="#b3541e" letter-spacing="1.2">GIRO 1</text>
  <text x="114" y="516" font-size="24" font-weight="700" fill="#1a1a1a">Taglia in scene → sunto</text>
  <text x="114" y="544" font-size="17" fill="#444">Marca scontri, abilità, decisioni.</text>

  <path d="M 502 505 L 574 505" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#freccia)"/>
  <rect x="578" y="466" width="136" height="78" fill="#ffffff" stroke="#b3541e" stroke-width="3"/>
  <text x="598" y="500" font-size="20" font-weight="700" fill="#b3541e">Leggi il</text>
  <text x="598" y="524" font-size="20" font-weight="700" fill="#b3541e">sunto</text>

  <path d="M 646 548 L 646 578 L 300 578 L 300 606" fill="none" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#freccia)"/>

  <!-- ═══ 2 · le domande ═══ -->
  <rect x="92" y="610" width="406" height="188" fill="#ffffff" stroke="#1a1a1a" stroke-width="4"/>
  <text x="114" y="644" font-size="15" font-weight="700" fill="#b3541e" letter-spacing="1.2">GIRO 2 · IL CUORE DEL METODO</text>
  <text x="114" y="676" font-size="24" font-weight="700" fill="#1a1a1a">Una domanda per ogni</text>
  <text x="114" y="704" font-size="24" font-weight="700" fill="#1a1a1a">casella vuota del JSON</text>
  <text x="114" y="736" font-size="17" fill="#444">scontro → «e se perde?»</text>
  <text x="114" y="760" font-size="17" fill="#444">abilità → «e chi non ce l'ha?»</text>
  <text x="114" y="784" font-size="17" fill="#444">decisione → «e se sceglie il contrario?»</text>

  <path d="M 502 700 L 574 700" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#freccia)"/>
  <rect x="578" y="662" width="136" height="78" fill="#ffffff" stroke="#b3541e" stroke-width="3"/>
  <text x="598" y="696" font-size="20" font-weight="700" fill="#b3541e">Tagli le</text>
  <text x="598" y="720" font-size="20" font-weight="700" fill="#b3541e">domande</text>

  <path d="M 718 700 L 786 700" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#freccia)"/>

  <!-- ═══ 3 · scrittore risponde ═══ -->
  <rect x="790" y="616" width="322" height="176" fill="#ffffff" stroke="#2f5d50" stroke-width="3"/>
  <text x="812" y="654" font-size="24" font-weight="700" fill="#2f5d50">Risponde scrivendo</text>
  <text x="812" y="688" font-size="17" fill="#3d4d48">Per ogni domanda dice cosa</text>
  <text x="812" y="710" font-size="17" fill="#3d4d48">succede, e dove la storia</text>
  <text x="812" y="732" font-size="17" fill="#3d4d48">riprende — citando una frase</text>
  <text x="812" y="754" font-size="17" fill="#3d4d48">del suo romanzo.</text>
  <text x="812" y="782" font-size="17" font-weight="700" fill="#2f5d50">Oppure: «qui muore».</text>

  <path d="M 951 796 L 951 826 L 300 826 L 300 854" fill="none" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#freccia)"/>

  <!-- ═══ 4 · integrazione ═══ -->
  <rect x="92" y="858" width="406" height="106" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="114" y="892" font-size="15" font-weight="700" fill="#b3541e" letter-spacing="1.2">GIRO 3</text>
  <text x="114" y="922" font-size="24" font-weight="700" fill="#1a1a1a">Integra e spezza</text>
  <text x="114" y="950" font-size="17" fill="#444">Una risposta lunga = più scene.</text>

  <path d="M 300 968 L 300 1002" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#freccia)"/>

  <!-- ═══ 5 · conta ═══ -->
  <rect x="92" y="1006" width="406" height="128" fill="#1a1a1a"/>
  <text x="114" y="1040" font-size="15" font-weight="700" fill="#e0a878" letter-spacing="1.2">GIRO 4 · IL TERMOSTATO</text>
  <text x="114" y="1070" font-size="24" font-weight="700" fill="#ffffff">Conta e avvisa</text>
  <text x="114" y="1098" font-size="17" fill="#d8d8d8">«le scelte bastano» · «niente</text>
  <text x="114" y="1120" font-size="17" fill="#d8d8d8">nuove sottotrame» · «ne mancano 8»</text>

  <!-- ciclo -->
  <path d="M 92 1070 L 44 1070 L 44 704 L 88 704" fill="none" stroke="#b3541e" stroke-width="4" stroke-dasharray="12,8" marker-end="url(#frecciaCiclo)"/>
  <text x="30" y="890" font-size="17" font-weight="700" fill="#b3541e" transform="rotate(-90 30 890)" text-anchor="middle">RESTANO CASELLE VUOTE? SI RICHIEDE</text>

  <!-- ═══ fine del ciclo ═══ -->
  <rect x="548" y="1006" width="592" height="128" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="572" y="1044" font-size="17" font-weight="700" fill="#1a1a1a">Il ciclo finisce da solo:</text>
  <text x="572" y="1076" font-size="19" fill="#444">quando nessun punto di gioco è rimasto</text>
  <text x="572" y="1100" font-size="19" fill="#444">senza risposta. Non si decide a occhio</text>
  <text x="572" y="1124" font-size="19" fill="#444">quando basta.</text>

  <path d="M 300 1138 L 300 1176" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#freccia)"/>

  <!-- ═══ chiusura ═══ -->
  <rect x="92" y="1180" width="1048" height="150" fill="#2f5d50"/>
  <text x="116" y="1218" font-size="15" font-weight="700" fill="#a8ccc0" letter-spacing="1.2">POI, E SOLO POI</text>
  <text x="116" y="1256" font-size="25" font-weight="700" fill="#ffffff">validate</text>
  <text x="248" y="1256" font-size="19" fill="#cfe0da">il grafo regge?</text>
  <text x="452" y="1256" font-size="25" font-weight="700" fill="#ffffff">forma</text>
  <text x="552" y="1256" font-size="19" fill="#cfe0da">ha la forma di un librogame?</text>
  <text x="116" y="1300" font-size="19" fill="#e6f0ec">Poi le morti su misura, i numeri dei nemici, i tiri di dado: nell'editor.</text>

  <!-- ═══ freno ═══ -->
  <rect x="92" y="1354" width="1048" height="92" fill="#ffffff" stroke="#b3541e" stroke-width="2.5"/>
  <text x="116" y="1390" font-size="19" font-weight="700" fill="#b3541e">IL FRENO — perché il giro finisca</text>
  <text x="116" y="1420" font-size="18" fill="#444">Dal secondo livello in poi <tspan font-weight="700">i rami rientrano</tspan>: possono avere uno scontro, ma quello scontro non apre altri mondi.</text>
  <text x="116" y="1440" font-size="18" fill="#444">«Tutta la storia fino al finale» vale per <tspan font-weight="700">uno o due rami</tspan>, dichiarati in partenza. Agli altri si chiede il rientro.</text>

  <!-- ═══ i numeri ═══ -->
  <line x1="60" y1="1490" x2="1140" y2="1490" stroke="#1a1a1a" stroke-width="3"/>
  <text x="60" y="1524" font-size="16" font-weight="700" fill="#1a1a1a" letter-spacing="1.2">I BERSAGLI, MISURATI SU 37 LIBROGAME PUBBLICATI · 3 serie, 2 autori, 2 generi</text>

  <g font-size="18" fill="#444">
    <text x="60" y="1568" font-size="33" font-weight="700" fill="#b3541e">1,65</text>
    <text x="60" y="1594">uscite per scena</text>
    <text x="60" y="1617" font-size="15" fill="#777">metà corridoi, metà bivi</text>

    <text x="290" y="1568" font-size="33" font-weight="700" fill="#b3541e">32%</text>
    <text x="290" y="1594">scene con più vie</text>
    <text x="290" y="1617" font-size="15" fill="#777">i rami devono rientrare</text>

    <text x="520" y="1568" font-size="33" font-weight="700" fill="#b3541e">3</text>
    <text x="520" y="1594">tappe di rientro</text>
    <text x="520" y="1617" font-size="15" fill="#777">mediana su 4898 bivi</text>

    <text x="750" y="1568" font-size="33" font-weight="700" fill="#b3541e">42%</text>
    <text x="750" y="1594">cammino obbligato</text>
    <text x="750" y="1617" font-size="15" fill="#777">il resto lo sceglie il lettore</text>

    <text x="980" y="1568" font-size="33" font-weight="700" fill="#b3541e">95%</text>
    <text x="980" y="1594">può ancora vincere</text>
    <text x="980" y="1617" font-size="15" fill="#777">perdere è l'eccezione</text>
  </g>

  <text x="60" y="1664" font-size="15" fill="#8a8a8a">ImmundaNoctisEx · doc/DA-ROMANZO-A-LIBROGAME.md · doc/FORMA-DEI-GRAFI.md · misure da projectaon.org</text>
</svg>
