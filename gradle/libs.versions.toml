[versions]
agp = "8.10.1"
kotlin = "2.3.21"
coreKtx = "1.16.0"
lifecycleRuntimeKtx = "2.9.1"
activityCompose = "1.10.1"
composeBom = "2024.09.00"
junit = "4.13.2"
kotlinxSerialization = "1.7.3"
workManager = "2.10.0"
# NON aggiornare alla 0.15.0 senza rifare la prova qui sotto.
#
# La 0.15.0 esiste su Google Maven (01/08/2026) e sarebbe la candidata
# naturale per il leak del 03/08 (vedi doc/DIARIO.md): fra i commit
# successivi alla 0.14.0 ce n'è uno che descrive esattamente il nostro
# caso — "Reset current context and executor if only session is
# released" (13/07/2026). Note di rilascio non ce ne sono: su GitHub
# l'ultima release è la v0.14.0 e la tag v0.15.0 non esiste.
#
# PROVATA il 03/08/2026: app e tool compilano entrambi, ma i test di
# :tool fanno CRASHARE la JVM dentro `litertlm_jni.dll` —
# EXCEPTION_UNCAUGHT_CXX_EXCEPTION in `nativeCreateEngine`, cioè
# un'eccezione C++ che esce dal binding e uccide il processo. Verificato
# in A/B: con la 0.14.0 `:tool:test` passa, con la 0.15.0 crasha.
# Il crash è dell'artefatto litertlm-JVM (Windows); su litertlm-ANDROID
# non dice nulla, sono native diverse.
litertlm = "0.14.0"
coroutines = "1.11.0"
jsoup = "1.17.2"
coil = "2.7.0"
composeMultiplatform = "1.11.1"
jlayer = "1.0.1"
# Layout gerarchico dei grafi (Sugiyama + instradamento degli archi).
# JGraphX, licenza BSD e zero dipendenze. Scelta dopo aver scartato
# Eclipse ELK, che sarebbe stato tecnicamente migliore ma trascina
# org.eclipse.xtext.xbase.lib, EPL-2.0 puro e incompatibile con la
# nostra GPL v3 (vedi DIARIO 06/08: confermato dal licensing contact
# della Eclipse Foundation, issue eclipse-xtext/xtext#2590 chiusa senza
# modifiche).
jgraphx = "4.2.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workManager" }
litertlm-android = { group = "com.google.ai.edge.litertlm", name = "litertlm-android", version.ref = "litertlm" }
# Stessa libreria, stessa VERSIONE dell'AAR Android: è il punto della
# funzione (02/08/2026, Michele: "voglio proprio avere una simulazione di
# quello che succede sul client"). Porta dentro le native JNI per
# windows-x86_64, linux-x86_64/aarch64 e darwin-aarch64.
litertlm-jvm = { group = "com.google.ai.edge.litertlm", name = "litertlm-jvm", version.ref = "litertlm" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
jsoup = { group = "org.jsoup", name = "jsoup", version.ref = "jsoup" }
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }
coil-gif = { group = "io.coil-kt", name = "coil-gif", version.ref = "coil" }
jlayer = { group = "javazoom", name = "jlayer", version.ref = "jlayer" }
jgraphx = { group = "com.github.vlsi.mxgraph", name = "jgraphx", version.ref = "jgraphx" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }